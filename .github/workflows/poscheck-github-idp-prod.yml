name: PosCheck-Push-to-IDP
run-name: ${{ github.actor }} is deploying new version to the IDP Stack

# Trigger deployment only on push to master branch
on:
  workflow_dispatch:
   inputs:
    environment:
     type: choice
     description: 'Input the environment you want to deploy'
     options: 
        - dev
        - qa
        - staging 
        - prod
     required: true

env:
  ENVIRONMENT: ${{ github.event.inputs.environment }} 
  PREFIX: ${{ secrets.ITBEM_POSCHECK_AF_PREFIX }}
  AWS_DEFAULT_REGION: ${{ secrets.ITBEM_POSCHECK_AF_AWS_DEFAULT_REGION }}
  ACCOUNT_ID: ${{ secrets.ITBEM_POSCHECK_AF_AWS_ACCOUNT_ID }}
  DOMAIN: ${{ secrets.ITBEM_POSCHECK_AF_DOMAIN }}
  GOOGLE_CLIENT_ID: ${{ secrets.ITBEM_POSCHECK_GOOGLE_CLIENT_ID }}

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
    steps:
      - id: AWSAccessSecretKey
        run: |
             SECRETKEY=$(echo "ITBEM_POSCHECK_AF_AWS_SECRET_ACCESS_KEY_${{ github.event.inputs.environment }}" | tr '[:lower:]' '[:upper:]')
             echo "AWSAccessSecretKeyValue=$SECRETKEY" >> $GITHUB_OUTPUT
      - id: AWSAccessIdKey
        run: |
             IDKEY=$(echo "ITBEM_POSCHECK_AF_AWS_ACCESS_KEY_ID_${{ github.event.inputs.environment }}" | tr '[:lower:]' '[:upper:]')
             echo "AWSAccessIdKeyValue=$IDKEY" >> $GITHUB_OUTPUT
      - id: RootUserPassword
        run: |
             ROOTUSERPASSWORD=$(echo "ITBEM_POSCHECK_AF_ROOT_USER_PASSWORD_${{ github.event.inputs.environment }}" | tr '[:lower:]' '[:upper:]')
             echo "RootUserPasswordValue=$ROOTUSERPASSWORD" >> $GITHUB_OUTPUT
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v5
        with:
          aws-access-key-id: ${{ secrets[steps.AWSAccessIdKey.outputs.AWSAccessIdKeyValue] }}
          aws-secret-access-key: ${{ secrets[steps.AWSAccessSecretKey.outputs.AWSAccessSecretKeyValue] }}
          role-to-assume: arn:aws:iam::${{ secrets.ITBEM_POSCHECK_AF_AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ACCOUNT_ROLE }}
          role-session-name: samplerolesession
          role-duration-seconds: 1200
          aws-region: ${{ secrets.ITBEM_POSCHECK_AF_AWS_DEFAULT_REGION }}

      - name: Deploy Idp
        run: |
            make $ENVIRONMENT idp deploy $PREFIX $DOMAIN $AWS_DEFAULT_REGION $ACCOUNT_ID ${{ secrets[steps.RootUserPassword.outputs.RootUserPasswordValue] }} $GOOGLE_CLIENT_ID
